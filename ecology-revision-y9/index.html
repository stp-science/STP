/* ---------- quadrat figure ---------- */
function quadratSVG(){
  const c=56,o=10,n=5;
  const moss=[0,1,5,6,7,11,12,18,24];
  const patches=[3,15,22];
  const daisies=[[2,.35,.4],[8,.6,.55],[9,.3,.65],[13,.55,.35],[16,.45,.6],[20,.6,.4],[23,.35,.5]];
  let s=`<svg viewBox="0 0 300 300" role="img" aria-label="A quadrat divided into 25 squares, with patches of moss and some daisies">`;
  s+=`<rect x="${o}" y="${o}" width="${c*n}" height="${c*n}" fill="var(--quad)"/>`;
  moss.forEach(i=>{const x=o+(i%n)*c,y=o+Math.floor(i/n)*c;s+=`<rect x="${x+3}" y="${y+3}" width="${c-6}" height="${c-6}" rx="10" fill="var(--leaf)"/>`});
  patches.forEach(i=>{const x=o+(i%n)*c,y=o+Math.floor(i/n)*c;s+=`<ellipse cx="${x+16}" cy="${y+40}" rx="11" ry="8" fill="var(--leaf)"/>`});
  daisies.forEach(([i,fx,fy])=>{const cx=o+(i%n)*c+fx*c,cy=o+Math.floor(i/n)*c+fy*c;
    for(let k=0;k<8;k++){const a=k*Math.PI/4;s+=`<ellipse cx="${(cx+Math.cos(a)*7).toFixed(1)}" cy="${(cy+Math.sin(a)*7).toFixed(1)}" rx="4.2" ry="2.6" transform="rotate(${k*45} ${(cx+Math.cos(a)*7).toFixed(1)} ${(cy+Math.sin(a)*7).toFixed(1)})" fill="var(--petal)"/>`}
    s+=`<circle cx="${cx}" cy="${cy}" r="4" fill="var(--sun)"/>`});
  for(let k=0;k<=n;k++){s+=`<line x1="${o+k*c}" y1="${o}" x2="${o+k*c}" y2="${o+n*c}" stroke="var(--ink)" stroke-opacity=".35" stroke-width="1.2"/><line x1="${o}" y1="${o+k*c}" x2="${o+n*c}" y2="${o+k*c}" stroke="var(--ink)" stroke-opacity=".35" stroke-width="1.2"/>`}
  s+=`<rect x="${o}" y="${o}" width="${c*n}" height="${c*n}" fill="none" stroke="var(--trunk)" stroke-width="6"/>`;
  return s+`</svg>`;
}
const quadratPre=`<div class="quadwrap">${quadratSVG()}<div class="stack" style="gap:.5rem"><p>This quadrat is <strong>0.5 m × 0.5 m</strong> and is split into 25 equal squares, so each square is <strong>4%</strong> of the quadrat.</p><p class="muted">For percentage cover, count a square only if it is at least half covered. Dark green patches are moss. The white flowers are daisies.</p></div></div>`;

/* ---------- transect figure ---------- */
function transectSVG(){
  let s=`<svg viewBox="0 0 720 250" role="img" aria-label="Diagram of a belt transect from native bush into a paddock with quadrats every 5 metres">`;
  s+=`<rect x="0" y="0" width="720" height="250" fill="var(--sky)"/>`;
  s+=`<circle cx="650" cy="44" r="22" fill="var(--sun)"/>`;
  s+=`<rect x="0" y="182" width="720" height="68" fill="var(--soil)"/>`;
  for(let x=300;x<720;x+=9){const h=10+((x*7)%9);s+=`<path d="M${x} 182 L${x+3} ${182-h} L${x+6} 182 Z" fill="var(--grass)"/>`}
  const trees=[[30,70],[85,52],[140,66],[195,48],[250,74],[300,96]];
  trees.forEach(([x,top])=>{s+=`<rect x="${x-5}" y="${top+30}" width="10" height="${182-top-30}" fill="var(--trunk)"/>`;
    s+=`<circle cx="${x}" cy="${top+18}" r="30" fill="var(--leaf)"/><circle cx="${x-18}" cy="${top+34}" r="20" fill="var(--leaf)"/><circle cx="${x+18}" cy="${top+32}" r="22" fill="var(--leaf)"/>`});
  [[20,0],[62,1],[110,0],[168,1],[222,0],[268,1]].forEach(([x,f])=>{for(let k=-2;k<=2;k++){s+=`<path d="M${x} 182 Q ${x+k*9} ${160} ${x+k*14} ${165+Math.abs(k)*3}" stroke="var(--leaf2)" stroke-width="3" fill="none"/>`}});
  s+=`<line x1="300" y1="30" x2="300" y2="200" stroke="var(--ink2)" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  s+=`<text x="306" y="28" font-family="var(--mono)" font-size="12" fill="var(--ink2)">bush edge</text>`;
  s+=`<text x="16" y="24" font-family="var(--body)" font-weight="700" font-size="15" fill="var(--ink)">Native bush</text>`;
  s+=`<text x="460" y="24" font-family="var(--body)" font-weight="700" font-size="15" fill="var(--ink)">Paddock</text>`;
  s+=`<line x1="40" y1="200" x2="680" y2="200" stroke="var(--ink)" stroke-width="2.5"/>`;
  for(let i=0;i<6;i++){const x=48+i*126;s+=`<rect x="${x-14}" y="186" width="28" height="28" fill="none" stroke="var(--tide)" stroke-width="3"/>`;
    s+=`<text x="${x}" y="236" text-anchor="middle" font-family="var(--mono)" font-size="13" fill="var(--ink)">${i*5} m</text>`}
  s+=`<text x="560" y="88" font-family="var(--mono)" font-size="12" fill="var(--ink2)">more light,</text><text x="560" y="104" font-family="var(--mono)" font-size="12" fill="var(--ink2)">drier soil →</text>`;
  return s+`</svg>`;
}

ext:[
 {t:'long',marks:6,q:'Plan a field investigation to find out how the <strong>distribution of ferns</strong> changes from inside native bush to the open paddock next to it.<br><span class="plain">In your answer: describe the sampling method and justify your choice; describe which abiotic factors you would measure and how; explain how you would make your data reliable.</span>',model:'<p>I would use a <strong>belt transect</strong>. I would run a tape measure from 10 m inside the bush, across the bush edge and 15 m into the paddock. A transect is the right choice because conditions change gradually from the bush into the paddock, and sampling at regular intervals along this gradient shows how the ferns change with distance. Random quadrats could miss parts of the gradient.</p><p>I would place a 0.5 m × 0.5 m quadrat every 5 m along the tape and estimate the <strong>percentage cover</strong> of ferns, because individual fern plants are hard to count.</p><p>At each quadrat I would measure <strong>light intensity</strong> with a light meter (lux) and <strong>soil moisture</strong> with a soil moisture meter (%), because these change between bush and paddock and could affect ferns. I would take all light readings close together in time so cloud cover doesn’t affect the comparison.</p><p>To make the data reliable I would take three abiotic readings at each quadrat and calculate a mean, use the same quadrat size every time, and repeat the whole transect two more times in different places along the bush edge, then calculate a mean fern cover for each distance.</p>',pts:['Chooses a (belt) transect from inside the bush into the paddock','Justifies it: conditions change gradually / gradient','Quadrats at regular intervals, recording % cover (or counts) of ferns','Names at least one abiotic factor with correct equipment and unit','Measures abiotic factors at each quadrat, at about the same time','Repeats (readings and/or transects) and calculates means for reliability']},
 {t:'long',marks:6,pre:T.t2,q:'Using the data in Table 2, explain how abiotic factors influence the distribution and abundance of <strong>ferns</strong> and <strong>grass</strong> along the transect.',model:'<p>Fern cover is highest inside the bush (65% at 0 m) and decreases to 0% at 20 m and 25 m in the paddock. Grass shows the opposite pattern, increasing from 5% at 0 m to 95% at 25 m.</p><p>Light intensity increases from 800 lux under the canopy to 22 000 lux in the paddock. Grass needs a lot of light to photosynthesise and grow quickly, so it is most abundant where light is high. Under the canopy there is too little light for much grass to grow.</p><p>Soil moisture decreases from 48% to 20% along the transect. Ferns grow best in moist, shaded conditions. In the open paddock, the higher light and drier soil mean fern fronds lose water and dry out, so ferns can’t survive there. Where grass grows well it may also out-compete any ferns for space and light (a biotic factor).</p><p>The data shows correlations between these abiotic factors and plant cover. It doesn’t prove which factor is the cause, because light and soil moisture change together.</p>',pts:['Describes fern pattern with data (e.g. 65% → 0%)','Describes grass pattern with data (e.g. 5% → 95%)','Links grass to increasing light, with data, and explains via photosynthesis','Links ferns to moist/shaded conditions, with soil moisture data, and explains drying out','Mentions a biotic factor such as competition between grass and ferns','Recognises correlation does not prove cause / both factors change together']},
 {t:'long',marks:6,pre:T.t3,q:'Using Table 3, explain the <strong>distribution of barnacles</strong> on the rocky shore. Refer to <strong>both abiotic and biotic</strong> factors, and use calculated means as evidence.',model:'<p>Barnacles are most abundant on the middle-upper shore, with a mean of 42 per quadrat at 2.0 m. There are very few on the lower shore (mean 3 at 0.5 m) and almost none at the top (mean 1 at 3.0 m). At 1.0 m the mean is 13.5 once the anomaly of 51 is left out.</p><p><strong>Top of the shore (abiotic):</strong> high on the shore the rocks are out of the water for a long time at low tide. Barnacles there risk drying out and overheating in the sun, and they can only filter-feed when covered by water, so they have less time to feed. Few survive above 2.5 m.</p><p><strong>Bottom of the shore (biotic):</strong> low on the shore conditions are less harsh, but there are more predators such as whelks and sea stars that eat barnacles. There is also competition for space on the rock with mussels and seaweeds. These biotic factors keep barnacle numbers low at 0.5 m.</p><p>At around 2.0 m the barnacles are covered by water often enough to feed, but are high enough to avoid most predators and competitors, so this is where they are most abundant.</p>',pts:['Describes the distribution, with the peak at 2.0 m (mean 42)','Uses the corrected mean of 13.5 at 1.0 m, or notes the anomaly','Abiotic: drying out / heat / exposure time limits barnacles high on the shore','Links exposure to feeding (filter-feed only when covered)','Biotic: predation (e.g. whelks) on the lower shore','Biotic: competition for space with mussels or seaweeds']}
]};


const NOTES={"p1": ["<h3>Distribution vs abundance</h3>\n        <p><span class=\"kw\">Distribution</span> is <em>where</em> organisms are found in a habitat.</p>\n        <p><span class=\"kw\">Abundance</span> is <em>how many</em> there are, as a count or a percentage cover.</p>\n        <p class=\"muted\">Barnacles are found high on the shore (distribution) at about 40 per quadrat (abundance).</p>\n      ", "<h3>Abiotic factors</h3>\n        <p>Non-living physical or chemical conditions.</p>\n        <ul><li>Light intensity</li><li>Temperature</li><li>Water / soil moisture</li><li>Soil pH and nutrients</li><li>Wind exposure</li><li>Salinity and time out of water (rocky shore)</li></ul>\n      ", "<h3>Biotic factors</h3>\n        <p>Effects of other living things.</p>\n        <ul><li>Predation (whelks eating mussels)</li><li>Competition for light, space, water or food</li><li>Grazing (sheep, possums)</li><li>Disease and parasites</li><li>Food supply and pollinators</li></ul>\n      "], "p2": ["<h3>Why sample?</h3>\n        <p>You can't count every plant in a field, so you count in small, <span class=\"kw\">representative</span> areas.</p>\n        <p>More samples give more <span class=\"kw\">reliable</span> results, because one unusual quadrat has less effect on the mean.</p>\n      ", "<h3>Quadrats</h3>\n        <p>A square frame of known area, often 0.5 m × 0.5 m = <strong>0.25 m²</strong>, or 1 m².</p>\n        <ul><li><strong>Count</strong> individuals you can tell apart (daisies, limpets).</li><li>Estimate <strong>percentage cover</strong> when you can't (grass, moss, lichen).</li></ul>\n      ", "<h3>Reducing bias</h3>\n        <p><span class=\"kw\">Bias</span> is when the results are skewed by the person sampling, for example by putting quadrats where there are lots of daisies.</p>\n        <p>Use <strong>random sampling</strong>: lay two tapes as axes and use a random number generator to pick the coordinates for each quadrat. Every part of the area then has an equal chance of being sampled.</p>\n        <p class=\"muted\">Random quadrats are best for comparing two areas, e.g. mown lawn vs long grass.</p>\n      ", "<h3>Transects</h3>\n        <p>A transect is a tape measure laid in a straight line across a habitat where conditions change, e.g. from bush into a paddock.</p>\n        <p>You record the organisms at regular intervals along the line to see how they change from one end to the other.</p>\n      "], "p3": ["<h3>Equipment and units</h3><div class=\"tablebox\">\n      <table class=\"kit\">\n        <thead><tr><th>Variable</th><th>Equipment</th><th>Unit</th><th>Good practice</th></tr></thead>\n        <tbody>\n          <tr><td>Light intensity</td><td>Light meter (or a phone light-sensor app)</td><td class=\"u\">lux</td><td>Hold the sensor at the same height and angle. Take all readings close together in time, because cloud changes light quickly.</td></tr>\n          <tr><td>Temperature</td><td>Thermometer or temperature probe</td><td class=\"u\">°C</td><td>Push soil probes to the same depth each time. Keep the probe out of direct sun for air temperature.</td></tr>\n          <tr><td>Soil moisture</td><td>Soil moisture meter</td><td class=\"u\">%</td><td>Take 3 readings around each quadrat and calculate the mean.</td></tr>\n          <tr><td>Soil pH</td><td>pH meter, or universal indicator and a soil test kit</td><td class=\"u\">pH (no unit)</td><td>Green = about pH 7 (neutral). Red/orange = acidic. Blue/purple = alkaline.</td></tr>\n          <tr><td>Wind speed</td><td>Anemometer</td><td class=\"u\">m/s</td><td>Measure for the same length of time at each point.</td></tr>\n          <tr><td>Salinity</td><td>Salinity meter</td><td class=\"u\">ppt</td><td>Useful in rock pools and estuaries.</td></tr>\n        </tbody>\n      </table>\n    </div>", "<h3>Measure where you sample</h3>\n        <p>Take abiotic readings <strong>at each quadrat</strong>. Then every count of organisms has matching conditions, and you can look for a relationship.</p>\n      ", "<h3>Choose relevant variables</h3>\n        <p>Pick variables that change across the habitat and could affect the organisms. On a rocky shore, time out of water matters more than soil pH.</p>\n      ", "<h3>Make readings reliable</h3>\n        <p>Repeat readings and calculate a mean. Use the same equipment, method and time of day for every point.</p>\n      "], "p4": ["<h3>Mean</h3>\n        <p class=\"formula\">mean = total of all values ÷ number of values</p>\n        <p class=\"muted\">Counts 4, 7, 5, 9, 5: total = 30, and there are 5 values. Mean = 30 ÷ 5 = <strong>6</strong>.</p>\n      ", "<h3>Range</h3>\n        <p class=\"formula\">range = highest value − lowest value</p>\n        <p class=\"muted\">Counts 4, 7, 5, 9, 5: range = 9 − 4 = <strong>5</strong>. A big range means the results are spread out.</p>\n      ", "<h3>Anomalies</h3>\n        <p>An <span class=\"kw\">anomaly</span> is a result that doesn't fit the pattern of the others. Check it or repeat it. If you leave it out of the mean, say so and explain why.</p>\n      ", "<h3>Describing a pattern</h3>\n        <p>Use “As ___ increases, ___ increases / decreases”. Quote data with units: “fern cover fell from 65% at 0 m to 0% at 20 m”.</p>\n        <p>A <span class=\"kw\">correlation</span> doesn't prove one thing causes the other.</p>\n      ", "<h3>Claim, Evidence, Reasoning</h3>\n        <ul><li><strong>Claim:</strong> what the pattern is.</li><li><strong>Evidence:</strong> numbers from the table.</li><li><strong>Reasoning:</strong> the biology that explains it.</li></ul>\n      "]};

function questionContext(id){const [p,n]=id.split('-'),q=qFor(id);if(q.pre)return q.pre;if(p==='p2'&&+n===6)return quadratPre;const m=q.q.match(/Table ([123])/);if(m)return T['t'+m[1]];if(p==='p4')return +n<6?T.t1:T.t3;return '';}

function question(id,index,count){const q=qFor(id),a=displayAnswer(id),context=questionContext(id),types={mcq:'Multiple choice',num:'Calculation',short:'Written answer',long:'Extended answer'};let h=`<div class="toolbar"><span class="small">Question ${index+1} of ${count}</span>${bar(index+1,count,'Question position')}</div><article class="question"><div class="question-top"><span class="badge">${types[q.t]}</span><span class="small">${q.pts?q.pts.length+' points to include':'Have a go, then check'}</span></div>${context?`${context.includes('<table')?'<p class="table-tip">Use this data. On a small screen, swipe the table to see every column.</p>':''}${context}`:''}<h2 class="q-text" id="question-title">${q.q.replace('the quadrat above','the quadrat shown')}</h2>`;

function markFeedback(){const el=$('#feedback');el.tabIndex=-1;el.focus({preventScroll:true});}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const action=b.dataset.action;if(action==='mixed'||action==='review')newSession(action);else if(action==='previous')move(-1);else if(action==='next')move(1);else if(action==='retry'){update({done:false,choice:null,correct:false});refresh();}else if(action==='reveal'){const a=answer(currentId);if(!$('#written-answer').value.trim()&&!a.allowReveal){update({allowReveal:true});$('#feedback').innerHTML='<p class="feedback retry">Have a go first — even a few words helps. You can press the button again to see the model.</p>';return;}const revealed=!a.revealed;update({revealed});$('#model').hidden=!revealed;b.textContent=revealed?'Hide model answer':'Check with the model answer';$('#feedback').innerHTML='';}else if(action==='save-self'){if(!$('#written-answer').value.trim()){$('#self-saved').textContent=' Add your own answer before saving a self-check.';return;}update({done:true});$('#self-saved').textContent=' Self-check saved.';}else if(action==='new-data'){newData();renderRoute();}else if(action==='reset'){state={answers:{},last:null};session=null;save();try{sessionStorage.removeItem('eco-session');}catch(e){}go('#home');}}));
if($('#trainer-form'))$('#trainer-form').addEventListener('submit',e=>{e.preventDefault();const m=number($('#trainer-mean').value),r=number($('#trainer-range').value);if(!Number.isFinite(m)||!Number.isFinite(r)){$('#feedback').innerHTML='<p class="feedback retry">Enter a number for both the mean and the range.</p>';return;}const total=trainerValues.reduce((a,b)=>a+b,0),mean=Math.round(total/6*10)/10,range=Math.max(...trainerValues)-Math.min(...trainerValues),mOk=Math.abs(m-mean)<.001,rOk=r===range;$('#feedback').innerHTML=`<div class="feedback ${mOk&&rOk?'':'retry'}"><strong>${mOk&&rOk?'✓ Both correct. Keep it going!':'Let’s check the steps.'}</strong><p>Mean ${mOk?'✓':'—'}: ${trainerValues.join(' + ')} = ${total}. Then ${total} ÷ 6 = ${mean}.</p><p>Range ${rOk?'✓':'—'}: ${Math.max(...trainerValues)} − ${Math.min(...trainerValues)} = ${range}.</p></div>`;});
if(!currentId)return;document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{const choice=+b.dataset.choice;update({done:true,choice,correct:choice===qFor(currentId).a});refresh();markFeedback();}));
if($('#number-form')){$('#number-answer').addEventListener('input',e=>{update({value:e.target.value,done:false,correct:false});$('#feedback').innerHTML='';if(currentIndex<queue.length-1)$('[data-action=next]').textContent='Skip for now';});$('#number-form').addEventListener('submit',e=>{e.preventDefault();const value=$('#number-answer').value,v=number(value),q=qFor(currentId);if(!Number.isFinite(v)){$('#feedback').innerHTML='<p class="feedback retry">Type a number before checking your answer.</p>';return;}update({value,done:true,correct:Math.abs(v-q.a)<=q.tol+1e-9});$('#feedback').innerHTML=feedback(q,answer(currentId));});}
if($('#written-answer'))$('#written-answer').addEventListener('input',e=>{update({text:e.target.value,done:false,points:[]});document.querySelectorAll('[data-point]').forEach(cb=>cb.checked=false);$('#self-total').textContent=`0 of ${qFor(currentId).pts.length} points included`;$('#self-saved').textContent='';if(currentIndex<queue.length-1)$('[data-action=next]').textContent='Skip for now';});document.querySelectorAll('[data-point]').forEach(cb=>cb.addEventListener('change',()=>{const points=[...document.querySelectorAll('[data-point]:checked')].map(x=>+x.dataset.point);update({points,done:false});$('#self-total').textContent=`${points.length} of ${qFor(currentId).pts.length} points included`;$('#self-saved').textContent='';if(currentIndex<queue.length-1)$('[data-action=next]').textContent='Skip for now';}));}
$('.skip').addEventListener('click',e=>{e.preventDefault();$('main').focus();});window.addEventListener('hashchange',renderRoute);renderRoute();

})();</script></body></html>
