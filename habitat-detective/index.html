<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habitat Detective | Year 9 Ecology (fixed)</title><style>
:root{--ink:#173047;--blue:#145c81;--mint:#e8f6ee;--paper:#f5f8fb;--line:#dce6ed;--accent:#e8f3ff;--gold:#ffefca}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--paper);color:var(--ink)}header{background:linear-gradient(115deg,#093d56,#126e75);color:white;padding:26px max(22px,calc((100vw - 1040px)/2))}header h1{font-size:clamp(28px,4vw,42px);margin:4px 0}header p{margin:4px 0 0;opacity:.94}.tag{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#a7efdb}main{max-width:1040px;margin:auto;padding:24px 20px 80px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav button{flex:1;min-width:120px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 5px 20px #0a30420a}.hidden{display:none!important}button,.button{cursor:pointer;border-radius:10px;border:1px solid #b9cbd7;background:white;color:#17415a;font:inherit;font-weight:750;padding:10px 15px}button:hover{filter:brightness(.97)}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f3ac42;outline-offset:2px}.primary,.nav button.active{background:#126a7a;color:white;border-color:#126a7a}button:disabled{opacity:.45;cursor:not-allowed}.subtle{color:#536777}.pill{display:inline-block;padding:4px 9px;font-size:12px;border-radius:999px;background:#e9f2f7;font-weight:800}h2{font-size:25px;margin:0 0 8px}h3{margin:0 0 8px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}.animal{font-size:40px;line-height:1.2}.match-card{display:flex;flex-direction:column;gap:10px}.match-card select{width:100%;padding:10px;border-radius:9px;border:1px solid #9bb5c4;background:white;color:var(--ink);font:inherit}.feedback{border-radius:12px;padding:12px 15px;margin-top:14px;background:#edf5fd;border-left:4px solid #3a86bd}.feedback.good{background:#e8f7ed;border-color:#2f9464}.feedback.warn{background:#fff6dc;border-color:#c18b20}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.progress{height:9px;background:#d8e4eb;border-radius:9px;overflow:hidden;margin:10px 0 20px}.progress span{display:block;height:100%;background:#2a9183;transition:width .2s}.challenge{padding:17px;border:1px solid #d8e3ed;border-radius:12px;margin-top:15px;background:#fcfeff}.choices{display:grid;gap:9px;margin-top:12px}.choice{text-align:left;display:flex;align-items:center;gap:12px}.choice.selected{background:#d9f4ef;border-color:#0e8d7a}.choice .letter{background:#e8edf1;border-radius:6px;padding:2px 9px;font-size:14px}.field{display:grid;gap:7px;margin-top:12px}textarea{min-height:94px;resize:vertical;width:100%;padding:12px;border-radius:10px;border:1px solid #9bb5c4;font:inherit}.scenario{background:linear-gradient(115deg,#f0fbf5,#eaf4ff);padding:16px;border-radius:14px;border:1px solid #d0e5dd}.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.kpi{padding:11px 16px;border-radius:11px;background:#eff5f9;min-width:155px}.kpi strong{display:block;font-size:24px}.species-map{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:410px;padding:13px;background:#e8f3e8;border:2px solid #a7ccb5;border-radius:12px}.cell{aspect-ratio:1;display:grid;place-items:center;font-size:22px;border-radius:5px;background:#d5e8d8}.map-row{display:flex;align-items:center;gap:28px;flex-wrap:wrap}.small{font-size:14px}.footer-actions{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.scorebox{background:#e5f5f1;padding:15px;border-radius:12px}.student{width:100%;max-width:330px;border:1px solid #a9becb;padding:10px 12px;font:inherit;border-radius:10px}.printonly{display:none}@media print{header,.nav,.actions,.footer-actions,.noprint{display:none!important}body{background:white}.panel{box-shadow:none;border:0;padding:0}.hidden{display:none!important}.printonly{display:block}}@media(max-width:550px){.panel{padding:17px}.species-map{max-width:100%}.cell{font-size:17px}}
</style></head><body><header><div class="tag">Year 9 Science · Apply</div><h1>🌿 Habitat Detective</h1><p>Use ecological evidence to predict where organisms live — and what happens when ecosystems change.</p></header><main><nav class="nav noprint" id="nav"></nav><section class="panel" id="content" aria-live="polite"></section></main><script>
const habitats=[['dry','☀️','Hot and very dry','Very little rainfall, intense sunshine'],['shade','🌳','Damp and shaded','High humidity, low light'],['light','🌱','Open and sunny','Lots of sunlight, little shelter'],['soil','🍂','Moist, rich soil','Damp soil with decaying organic matter'],['coast','🌊','Salty and flooded','Regular tides and salty water'],['cold','🏔️','Cold and exposed','Low temperatures and strong winds'],['water','💧','Underwater','Surrounded by water and receiving light']];
const organisms=[['Moss','🟩','shade','Absorbs water across its surface and easily dries out.'],['Cactus','🌵','dry','Stores water in a thick stem, helping it survive drought.'],['Grass','🌾','light','Usually grows well with sunlight for photosynthesis.'],['Earthworm','🪱','soil','Needs moist soil to breathe through its skin and feeds on decaying material.'],['Fern','🌿','shade','Often thrives in moist, shaded places.'],['Seaweed','🌊','water','Lives in water and needs light for photosynthesis.'],['Lichen','🪨','cold','Some lichens survive exposed, cold conditions.'],['Mangrove','🌴','coast','Tolerates salty, waterlogged coastal conditions.'],['Pine tree','🌲','cold','Many pines tolerate cold, exposed sites, though species vary.']];
const stages=['Start','1 · Match habitats','2 · Predict changes','3 · Introduced species','Review'];let stage=0;let matches={},checked=false;let checkMessage="";let responses={};let selected={};let completed={};const $=x=>document.getElementById(x);function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function bar(){let n=Object.keys(completed).length;return `<div class="progress" aria-label="Progress"><span style="width:${n*25}%"></span></div>`}function nav(){ $('nav').innerHTML=stages.map((s,i)=>`<button class="${i===stage?'active':''}" onclick="go(${i})">${s}</button>`).join('')}function go(i){stage=i;nav();render();window.scrollTo({top:0,behavior:'smooth'})}function checkMatches(){let missing=organisms.filter(o=>!matches[o[0]]);let chosen=organisms.length-missing.length;checked=chosen>0;checkMessage=chosen===0?'Select a habitat for at least one organism to check it.':missing.length?`Your ${chosen} selected ${chosen===1?'match has':'matches have'} been checked below. ${missing.length} still to match: ${missing.map(o=>o[0]).join(', ')}.`:'All nine have been checked. Review the feedback below.';render();$('matchStatus')?.scrollIntoView({behavior:'smooth',block:'center'});}function updateMatchProgress(){let number=organisms.filter(o=>matches[o[0]]).length;let status=$('matchStatus');if(status)status.innerHTML=`<strong>Matched ${number}/9 organisms.</strong> ${number===9?'All nine matched — ready to check!':'You can check your current choices, or finish matching the remaining organisms.'}`;let button=$('checkMatchButton');if(button)button.textContent=`Check my matches (${number}/9)`;}
$('content').addEventListener('change',event=>{let el=event.target.closest('select[data-organism]');if(!el)return;matches[el.dataset.organism]=el.value;checked=false;checkMessage='';updateMatchProgress();$('matchFeedback')?.remove();document.querySelectorAll('.match-judgement').forEach(el=>el.remove());if($('matchContinue'))$('matchContinue').disabled=true;});
function checkReasoning(){const written=$('written');if(written)responses.explain=written.value;const missing=[];if(selected.pred===undefined)missing.push('choose an answer about abundance');if(selected.dist===undefined)missing.push('choose an answer about distribution');if((responses.explain||'').trim().length<40)missing.push('write at least 40 characters explaining your reasoning');if(missing.length){const status=$('reasonStatus');if(status){status.className='feedback warn';status.textContent='Before checking, please '+missing.join('; ')+'.';status.scrollIntoView({behavior:'smooth',block:'nearest'});}return;}responses.checked3=true;render();$('reasonResult')?.scrollIntoView({behavior:'smooth',block:'nearest'});}
function next(){completed[stage]=true;go(Math.min(4,stage+1))}function render(){let c=$('content');if(stage===0)c.innerHTML=`<span class="pill">Application challenge · approx. 20–25 minutes</span><h2>Can you think like an ecologist?</h2><p>Scientists don't just describe organisms. They use evidence to <strong>predict their distribution</strong> and explain <strong>changes in abundance</strong>.</p><div class="grid"><div class="card"><h3>🧭 Distribution</h3><p>Where individuals of a species are found in an area.</p></div><div class="card"><h3>🔢 Abundance</h3><p>How many individuals of a species are present in a defined area.</p></div><div class="card"><h3>🌦️ Abiotic factors</h3><p>Non-living conditions, such as light, water and temperature.</p></div><div class="card"><h3>🦊 Biotic factors</h3><p>Living things and interactions, such as predation and competition.</p></div></div><div class="scenario" style="margin-top:16px"><strong>Your mission:</strong> Match organisms to suitable habitats, investigate changes in abundance and distribution, then explain the impact of an introduced predator.</div><div class="actions"><button class="primary" onclick="next()">Start the investigation →</button></div>`;
if(stage===1){let number=organisms.filter(o=>matches[o[0]]).length;let correct=organisms.filter(o=>matches[o[0]]===o[2]).length;c.innerHTML=`<span class="pill">Task 1 · Abiotic factors and distribution</span><h2>Where would each organism thrive?</h2><p>Choose the <strong>most suitable</strong> habitat for each organism. Several organisms may share one habitat. In real life, many species tolerate more than one habitat — choose the best match from the options.</p><p class="small subtle" id="matchStatus" role="status"><strong>Matched ${number}/9 organisms.</strong> ${checkMessage|| (number===9?"All nine matched — ready to check!":"Choose habitats and press Check my matches whenever you want feedback.")}</p>${bar()}<div class="grid">${organisms.map(o=>`<div class="card match-card"><div class="animal">${o[1]}</div><h3>${o[0]}</h3><label for="m-${o[0].replace(/ /g,'')}">Habitat</label><select id="m-${o[0].replace(/ /g,'')}" data-organism="${escapeHtml(o[0])}"><option value="">Choose a habitat...</option>${habitats.map(h=>`<option value="${h[0]}" ${matches[o[0]]===h[0]?'selected':''}>${h[1]} ${h[2]}</option>`).join('')}</select>${checked&&matches[o[0]]?`<div class="small match-judgement"><strong>${matches[o[0]]===o[2]?'✓ Suitable match':'↻ Reconsider this match'}</strong><div>${matches[o[0]]===o[2]?o[3]:o[0]==='Cactus'?'Cacti need sunshine, but are particularly adapted to very dry conditions. Compare the two sunny habitats.':'Consider the moisture, temperature, light and other conditions this organism needs.'}</div></div>`:''}</div>`).join('')}</div>${checked?`<div id="matchFeedback" class="feedback ${correct===9?'good':'warn'}" role="status"><strong>${correct}/${number} selected matches suitable.</strong> ${correct===9?'Excellent ecological reasoning.':number<9?'Finish the remaining cards, then check again.':'Review the cards marked “Reconsider” and try again.'}</div>`:''}<div class="actions"><button id="checkMatchButton" class="primary" onclick="checkMatches()">Check my matches (${number}/9)</button><button id="matchContinue" class="primary" onclick="next()" ${!checked||correct<9?'disabled':''}>Continue →</button></div><details style="margin-top:16px"><summary>Habitat clues</summary><p>${habitats.map(h=>`${h[1]} <strong>${h[2]}:</strong> ${h[3]}`).join('<br>')}</p></details>`;}
if(stage===2){let questions=[{title:'A forest dries out',desc:'A shady forest experiences several months of unusually dry weather. What is the most likely change to moss in that forest?',opts:['Moss abundance increases because it likes dry conditions.','Moss abundance decreases because it needs moisture.','Moss abundance stays exactly the same.'],correct:1,explain:'Drier conditions make survival and reproduction harder for many mosses. The number of moss plants is likely to decrease.',type:'Abundance · abiotic'},{title:'Same number, new pattern',desc:'Eight ferns grow throughout a forest. After a heatwave, all eight are found beside one damp stream. What has changed?',opts:['Distribution has changed but abundance has not.','Abundance has increased.','Abundance and distribution must both have increased.'],correct:0,explain:'There are still eight ferns, so abundance is unchanged. They are now clustered near the stream, so their distribution changed.',type:'Distribution · abiotic'},{title:'Rabbits arrive',desc:'A grassy field initially has very few rabbits. More rabbits enter the field and feed heavily on the grass. Predict the most likely impact.',opts:['Grass abundance increases everywhere.','Grass abundance may decrease, especially where rabbits graze most.','Grass distribution and abundance can never change because of animals.'],correct:1,explain:'Feeding is a biotic interaction. Heavy grazing can reduce grass abundance and create uneven distribution.',type:'Abundance and distribution · biotic'}];let ready=questions.every((q,i)=>selected['q'+i]!==undefined);c.innerHTML=`<span class="pill">Task 2 · Apply your knowledge</span><h2>What happens when conditions change?</h2><p>Choose the most scientifically reasonable prediction. After answering all three, check your reasoning.</p>${questions.map((q,i)=>`<div class="challenge"><span class="pill">${q.type}</span><h3 style="margin-top:8px">${i+1}. ${q.title}</h3><p>${q.desc}</p><div class="choices">${q.opts.map((x,j)=>`<button class="choice ${selected['q'+i]===j?'selected':''}" onclick="selected['q${i}']=${j};render()"><span class="letter">${'ABC'[j]}</span>${x}</button>`).join('')}</div>${responses['checked2']?`<div class="feedback ${selected['q'+i]===q.correct?'good':'warn'}"><strong>${selected['q'+i]===q.correct?'Correct':'Not quite'}</strong> — ${q.explain}</div>`:''}</div>`).join('')}<div class="actions"><button onclick="responses.checked2=true;render()" ${!ready?'disabled':''}>Check predictions</button><button class="primary" onclick="next()" ${!responses.checked2?'disabled':''}>Continue →</button></div>`;}
if(stage===3){let before=['🐦','','🐦','','🐦','','','🐦','','🐦','','🐦','','🐦','','','🐦','','🐦','','🐦','','','🐦','','🐦','','🐦','','🐦','',''];let after=['','','','','🐦','','','','','','','','🐦','','','','','','','','🐦','','','','','','','','','','',''];let count=a=>a.filter(x=>x==='🐦').length;let map=a=>`<div class="species-map" aria-label="Illustrative map showing ${count(a)} birds">${a.map(x=>`<div class="cell">${x||'·'}</div>`).join('')}</div>`;let a=(responses.explain||'').trim().length>=40;c.innerHTML=`<span class="pill">Task 3 · Biotic factors</span><h2>When a predator is introduced</h2><div class="scenario"><strong>Hypothetical model:</strong> An introduced predator begins hunting a native bird in a forest. The grid below shows simplified, invented counts in the <strong>same sampled area</strong> before and after. These are not real New Zealand field data.</div><div class="map-row" style="margin-top:18px"><div><h3>Before introduction</h3>${map(before)}<p class="small"><strong>${count(before)} birds</strong> observed</p></div><div><h3>After introduction</h3>${map(after)}<p class="small"><strong>${count(after)} birds</strong> observed</p></div></div><div class="challenge"><h3>1. What happened to abundance?</h3><div class="choices">${['It increased','It decreased','It stayed the same'].map((s,i)=>`<button class="choice ${selected.pred===i?'selected':''}" onclick="selected.pred=${i};render()">${s}</button>`).join('')}</div></div><div class="challenge"><h3>2. What happened to distribution?</h3><div class="choices">${['The remaining birds are found in fewer parts of the area.','Every bird moved outside the forest.','Nothing can be concluded about where the birds are located.'].map((s,i)=>`<button class="choice ${selected.dist===i?'selected':''}" onclick="selected.dist=${i};render()">${s}</button>`).join('')}</div></div><div class="challenge"><h3>3. Explain the pattern</h3><label for="written">Explain how the introduction of a predator could affect both abundance and distribution. Use <strong>predation, abundance, distribution</strong> in your answer.</label><textarea id="written" placeholder="The introduced predator could..." oninput="responses.explain=this.value;document.getElementById('lengthTip').textContent=this.value.trim().length>=40?'Enough detail to review your answer.':'Add an explanation (at least 40 characters).';" >${escapeHtml(responses.explain||'')}</textarea><p class="small subtle" id="lengthTip">${a?'Enough detail to review your answer.':'Add an explanation (at least 40 characters).'}</p></div><p class="small subtle">Choose both answers and write your explanation, then check your reasoning.</p><div id="reasonStatus" role="status"></div><div class="actions"><button id="checkReasoningButton" class="primary" onclick="checkReasoning()">Check my reasoning</button><button class="primary" onclick="next()" ${!responses.checked3?'disabled':''}>Finish →</button></div>${responses.checked3?`<div id="reasonResult" class="feedback ${selected.pred===1&&selected.dist===0?'good':'warn'}"><strong>Abundance:</strong> It fell from ${count(before)} to ${count(after)} birds (${count(before)-count(after)} fewer).<br><strong>Distribution:</strong> Birds were observed in fewer grid cells and became more clustered. These maps show a change in pattern; the introduction is a possible cause, not proof of the exact cause.<br><strong>Example explanation:</strong> Increased predation could reduce the abundance of native birds. Survivors might become restricted to safer areas, changing their distribution.${selected.pred!==1||selected.dist!==0?'<p>Check your first two choices against the grids.</p>':''}</div>`:''}`;}
if(stage===4){let q2=[0,1,2].map(i=>selected['q'+i]);let count=(Object.keys(matches).filter(k=>matches[k]===organisms.find(o=>o[0]===k)?.[2]).length);c.innerHTML=`<span class="pill">Review · Exit ticket</span><h2>Ecology challenge complete</h2><p>You've used habitat conditions, ecological interactions and modelled evidence to explain where organisms live and why populations change.</p><div class="kpis"><div class="kpi"><span>Habitat matches</span><strong>${count}/9</strong></div><div class="kpi"><span>Predictions attempted</span><strong>${q2.filter(x=>x!==undefined).length}/3</strong></div><div class="kpi"><span>Predator challenge</span><strong>${responses.checked3?'Done':'Not yet'}</strong></div></div><div class="challenge"><h3>Exit ticket</h3><p><strong>Claim:</strong> “The number of birds declined, so their distribution must have changed.” Is this always true?</p><p>Write an answer in your book that includes an example or reason.</p><details><summary>Check the model answer</summary><p>No. Abundance can decrease while the general distribution pattern stays similar. A change in number does not automatically prove a change in where organisms are found.</p></details></div><p class="small subtle">Teacher note: matching is a simplified prediction exercise. Actual organism distribution and abundance require field observations and sampling.</p><div class="footer-actions"><button onclick="go(1)">Review matching</button><button onclick="go(2)">Review predictions</button><button onclick="go(3)">Review predators</button><button class="primary" onclick="window.print()">Print this summary</button><button onclick="if(confirm('Clear all answers and start again?')){matches={};checked=false;checkMessage="";responses={};selected={};completed={};go(0)}">Start again</button></div>`;}}
nav();render();
</script></body></html>
